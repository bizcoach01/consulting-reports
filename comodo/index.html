<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>꼬모도블루 | 단체주문 & 컨설팅 보고서</title>
<style>
:root{--green:#49642f;--green2:#718c4b;--cream:#faf7ef;--ink:#24301f;--muted:#66705f;--line:#e6e5dc}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Noto Sans KR",Arial,sans-serif;background:var(--cream);color:var(--ink)}
.wrap{max-width:1040px;margin:auto;padding:42px 20px 64px}
.hero{background:#fff;border-radius:24px;overflow:hidden;box-shadow:0 12px 36px rgba(35,48,31,.10)}
.hero img{display:block;width:100%;height:auto}
.info{padding:30px}.kicker{font-size:14px;font-weight:800;color:var(--green2);letter-spacing:.08em}
h1{font-size:34px;margin:8px 0 10px}p{font-size:18px;line-height:1.7;color:var(--muted);margin:0}
.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}
.btn{display:inline-block;text-decoration:none;background:var(--green);color:#fff;padding:14px 20px;border-radius:12px;font-weight:800}
.btn.secondary{background:#fff;color:var(--green);border:1px solid var(--green)}
.reports{margin-top:30px;background:#fff;border-radius:20px;padding:28px}.reports h2{margin:0 0 18px;font-size:25px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.card{display:block;text-decoration:none;color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:20px;min-height:125px}
.card strong{display:block;font-size:18px;margin-bottom:8px}.card span{color:var(--muted);line-height:1.5}
@media(max-width:720px){.wrap{padding:18px 12px 40px}.info{padding:22px}h1{font-size:27px}.grid{grid-template-columns:1fr}p{font-size:16px}}
</style>
</head>
<body>
<main class="wrap">
<section class="hero">
<img src="images/comodo-group-order.png" alt="꼬모도블루 샌드위치 단체주문 안내 포스터">
<div class="info">
<div class="kicker">COMODO BLUE · GROUP ORDER</div>
<h1>꼬모도블루 단체주문 안내</h1>
<p>회의·행사·모임에 간편하고 든든한 샌드위치를 준비합니다. 신선한 재료, 푸짐한 구성, 깔끔한 포장으로 맞춤 수량과 시간에 맞춰 준비합니다.</p>
<div class="actions">
<a class="btn" href="tel:0269532030">단체주문 문의 02-6953-2030</a>
<a class="btn secondary" href="#reports">컨설팅 보고서 보기</a>
</div>
</div>
</section>
<section class="reports" id="reports">
<h2>꼬모도블루 컨설팅 보고서</h2>
<div class="grid">
<a class="card" href="report1.html"><strong>01. 온라인마케팅 현황 분석 보고서</strong><span>현재 온라인 채널과 마케팅 운영 현황을 진단합니다.</span></a>
<a class="card" href="report2.html"><strong>02. 경쟁분석 기반 컨설팅 보고서</strong><span>경쟁환경과 차별화 방향, 실행 전략을 정리합니다.</span></a>
</div>
</section>
</main>
</body>
</html>
